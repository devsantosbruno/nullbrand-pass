# electron-builder configuration. Run through `npm run package` (installer for the host OS) or `npm run package:dir` (unpacked app).
# Everything is relative to this folder. The app comes from dist/app (see scripts/stage.mjs); installers go to dist/release.
# dist/ is ignored by git. This configuration is UNSIGNED on purpose (local builds); releases use builder.release.yml, which signs.
appId: dev.nullbrand.pass
productName: nullbrand pass
copyright: Copyright © Bruno Santos
directories:
  buildResources: build
  app: dist/app
  output: dist/release
# <project>-<version>-<os>-<arch>.<ext>: each project's download page finds its files by this pattern (ADR 0001).
artifactName: nullbrand-pass-${version}-${os}-${arch}.${ext}
asar: true
npmRebuild: false
# The type declarations only exist for the type checker.
files:
  - '**/*'
  - '!**/*.d.ts'
  - '!**/*.map'
forceCodeSigning: false

# Fuses are flipped in the packaged Electron binary: they turn off the ways a local process could make the app run other code.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
  # Flipping fuses breaks the ad-hoc signature of the arm64 macOS binary and the system then kills the app. Unsigned builds need it
  # re-created; it does not replace real signing.
  resetAdHocDarwinSignature: true

mac:
  # Both Mac architectures: a Mac with an Intel chip needs its own download. Release signing repeats this list in builder.release.mjs.
  target:
    - target: dmg
      arch: [x64, arm64]
  category: public.app-category.utilities
  # null: never pick up a certificate from the keychain by accident. Release signing is in builder.release.yml.
  identity: null
win:
  target: nsis
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
linux:
  target:
    - AppImage
    - deb
  category: Utility
  maintainer: Bruno Santos
