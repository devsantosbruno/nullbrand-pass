<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>nullbrand</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main id="screen-nosession" class="screen center" hidden>
    <div class="card auth">
      <div class="brand"><span class="dim" aria-hidden="true">$</span><span class="t">nullbrand</span></div>
      <div id="nosession-info">
        <h1 data-i18n="nosession.title"></h1>
        <p class="muted" data-i18n="nosession.body" data-i18n-code="npx nullbrand"></p>
      </div>
      <div id="nosession-fail" hidden>
        <p class="error" role="alert" data-i18n="err.http.invalidResponse"></p>
        <button class="btn primary block" type="button" id="nosession-retry" data-i18n="nosession.retry"></button>
      </div>
    </div>
  </main>

  <main id="screen-setup" class="screen center" hidden>
    <div class="card auth" id="form-setup" role="group">
      <div class="brand"><span class="dim" aria-hidden="true">$</span><span class="t">nullbrand</span></div>
      <h1 data-i18n="setup.title"></h1>
      <p class="muted" data-i18n="setup.intro"></p>
      <label><span data-i18n="field.masterPassword"></span>
        <input type="text" data-masked id="setup-pass" data-i18n-placeholder="setup.placeholder" minlength="8" required autocomplete="off">
      </label>
      <div class="meter"><span id="setup-meter"></span></div>
      <label><span data-i18n="setup.confirm"></span>
        <input type="text" data-masked id="setup-pass2" data-i18n-placeholder="setup.confirmPlaceholder" minlength="8" required autocomplete="off">
      </label>
      <p class="error" id="setup-error" role="alert"></p>
      <button class="btn primary block" type="button" id="setup-btn" data-i18n="setup.submit"></button>
    </div>
  </main>

  <main id="screen-unlock" class="screen center" hidden>
    <div class="card auth" id="form-unlock" role="group">
      <div class="brand"><span class="dim" aria-hidden="true">$</span><span class="t">nullbrand</span></div>
      <h1 data-i18n="unlock.title"></h1>
      <p class="muted small"><code id="unlock-path"></code></p>
      <label><span data-i18n="field.masterPassword"></span>
        <input type="text" data-masked id="unlock-pass" data-i18n-placeholder="unlock.placeholder" required autocomplete="off">
      </label>
      <p class="error" id="unlock-error" role="alert"></p>
      <button class="btn primary block" type="button" id="unlock-btn" data-i18n="unlock.submit"></button>
    </div>
  </main>

  <div id="screen-vault" class="screen app" hidden>
    <aside class="sidebar" id="sidebar">
      <div class="brand"><span class="dim" aria-hidden="true">$</span><span class="t">nullbrand</span></div>
      <nav id="filters" data-i18n-aria="nav.filters">
        <button data-filter="all" class="filter active" data-i18n-title="filter.all"><span class="lbl"><i data-icon-slot="list" data-icon-size="16" data-icon-stroke="2" data-icon-class="ico"></i><span class="t" data-i18n="filter.all"></span></span> <span class="count" id="count-all"></span></button>
        <button data-filter="favorite" class="filter" data-i18n-title="filter.favorites"><span class="lbl"><i data-icon-slot="star-line" data-icon-size="16" data-icon-stroke="2" data-icon-class="ico"></i><span class="t" data-i18n="filter.favorites"></span></span></button>
        <button data-filter="login" class="filter" data-i18n-title="filter.logins"><span class="lbl"><i data-icon-slot="key-line" data-icon-size="16" data-icon-stroke="2" data-icon-class="ico"></i><span class="t" data-i18n="filter.logins"></span></span></button>
        <button data-filter="card" class="filter" data-i18n-title="filter.cards"><span class="lbl"><i data-icon-slot="credit-card" data-icon-size="16" data-icon-stroke="2" data-icon-class="ico"></i><span class="t" data-i18n="filter.cards"></span></span></button>
        <button data-filter="identity" class="filter" data-i18n-title="filter.identities"><span class="lbl"><i data-icon-slot="id-card" data-icon-size="16" data-icon-stroke="2" data-icon-class="ico"></i><span class="t" data-i18n="filter.identities"></span></span></button>
        <button data-filter="ssh" class="filter" data-i18n-title="filter.ssh"><span class="lbl"><i data-icon-slot="key" data-icon-size="16" data-icon-stroke="2" data-icon-class="ico"></i><span class="t" data-i18n="filter.ssh"></span></span></button>
        <button data-filter="note" class="filter" data-i18n-title="filter.notes"><span class="lbl"><i data-icon-slot="file-text" data-icon-size="16" data-icon-stroke="2" data-icon-class="ico"></i><span class="t" data-i18n="filter.notes"></span></span></button>
      </nav>
      <div class="folders-group">
      <div class="folders-head">
        <div class="folders-title"><i data-icon-slot="folder" data-icon-size="14" data-icon-stroke="2" data-icon-class="ico"></i><span class="t" data-i18n="folders.title"></span></div>
        <button class="icon-btn" id="btn-new-folder" type="button" data-i18n-title="folders.new" data-i18n-aria="folders.new"><i data-icon-slot="plus" data-icon-size="14" data-icon-stroke="2"></i></button>
      </div>
      <nav id="folders" data-i18n-aria="folders.title"></nav>
      </div>
      <div class="sidebar-foot">
        <button class="btn ghost block" id="btn-generator" data-i18n-title="sidebar.generator"><i data-icon-slot="refresh" data-icon-size="16" data-icon-stroke="2" data-icon-class="ico"></i><span class="t" data-i18n="sidebar.generator"></span></button>
        <button class="btn ghost block" id="btn-tools" data-i18n-title="sidebar.tools"><i data-icon-slot="archive" data-icon-size="16" data-icon-stroke="2" data-icon-class="ico"></i><span class="t" data-i18n="sidebar.tools"></span></button>
        <div class="dropdown" id="security-menu">
          <button class="btn ghost block" id="btn-security" aria-haspopup="menu" aria-expanded="false" aria-controls="security-items" data-i18n-title="sidebar.security"><i data-icon-slot="shield-line" data-icon-size="16" data-icon-stroke="2" data-icon-class="ico"></i><span class="t" data-i18n="sidebar.security"></span></button>
          <div class="dropdown-menu" id="security-items" role="menu" hidden>
            <button role="menuitem" id="btn-open-pw" data-i18n="menu.changePassword"></button>
            <a role="menuitem" id="link-report" href="https://github.com/devsantosbruno/nullbrand-pass/issues/new/choose" target="_blank" rel="noopener noreferrer" data-i18n="menu.report"></a>
            <button role="menuitem" id="btn-open-shutdown" data-i18n="menu.quit"></button>
            <div class="dropdown-sep" role="separator"></div>
            <button role="menuitem" class="destructive" id="btn-open-destroy" data-i18n="menu.deleteVault"></button>
          </div>
        </div>
        <div class="sidebar-sep" role="separator"></div>
        <button class="btn ghost block" id="btn-lock" data-i18n-title="sidebar.lock"><i data-icon-slot="lock" data-icon-size="16" data-icon-stroke="2" data-icon-class="ico"></i><span class="t" data-i18n="sidebar.lock"></span></button>
      </div>
    </aside>

    <section class="list-pane">
      <div class="list-head">
        <button class="icon-btn sidebar-toggle" id="btn-sidebar" type="button" data-i18n-aria="sidebar.toggle" aria-expanded="true" aria-controls="sidebar" data-i18n-title="sidebar.toggleTitle"><i data-icon-slot="sidebar" data-icon-size="16" data-icon-stroke="2"></i></button>
        <input type="search" id="search" data-i18n-placeholder="list.search" data-i18n-aria="list.searchAria">
        <button class="btn primary" id="btn-new" data-i18n-title="list.newTitle" data-i18n="list.new"></button>
      </div>
      <div class="sel-bar" id="sel-bar" hidden>
        <div class="sel-top">
          <label class="sel-all"><input type="checkbox" id="sel-all"><span data-i18n="sel.all"></span></label>
          <span class="sel-count" id="sel-count" role="status" aria-live="polite"></span>
        </div>
        <div class="sel-actions">
          <button class="btn" id="sel-folder" type="button" aria-haspopup="menu" aria-expanded="false" data-i18n="sel.addToFolder"></button>
          <button class="btn danger" id="sel-delete" type="button" data-i18n="common.delete"></button>
          <button class="btn ghost" id="sel-cancel" type="button" data-i18n="common.cancel"></button>
        </div>
        <div class="select-menu sel-menu" id="sel-menu" role="menu" hidden></div>
      </div>
      <ul id="item-list" class="item-list" data-i18n-aria="list.aria"></ul>
      <div id="empty-list" class="empty" hidden>
        <p data-i18n="list.empty"></p>
        <p class="muted small" data-i18n="list.emptyHint"></p>
      </div>
      <div class="resize-handle" id="resize-handle" role="separator" aria-orientation="vertical" data-i18n-aria="list.resize" tabindex="0"></div>
    </section>

    <section class="detail-pane" id="detail-pane">
      <div class="empty" id="detail-empty">
        <span class="prompt-big" aria-hidden="true">$</span>
        <p class="muted" data-i18n="detail.select"></p>
      </div>

      <div id="detail-view" hidden>
        <div class="dv-head">
          <button class="btn ghost icon back" id="btn-back" data-i18n-aria="common.back">←</button>
          <div class="dv-avatar" id="view-avatar" aria-hidden="true"></div>
          <div class="dv-title">
            <div class="dv-title-row">
              <h2 id="view-name"></h2>
              <button class="dv-icon-btn" id="btn-fav" type="button" aria-pressed="false" data-i18n-aria="item.favorite"></button>
            </div>
            <div class="dv-chips" id="view-chips"></div>
          </div>
          <button class="dv-edit" id="btn-edit" type="button" data-i18n="common.edit"></button>
        </div>
        <div class="dv-fields" id="view-fields"></div>
        <div class="dv-ssh-download" id="view-ssh-download" hidden></div>
        <div id="view-notes" hidden></div>
        <div class="dv-meta" id="view-meta"></div>
      </div>

      <form id="detail-edit" autocomplete="off" hidden>
        <div class="detail-head">
          <h2 id="edit-title"></h2>
        </div>
        <div class="seg" role="radiogroup" data-i18n-aria="type.label">
          <label><input type="radio" name="type" value="login" checked> <span data-i18n="type.login"></span></label>
          <label><input type="radio" name="type" value="note"> <span data-i18n="type.note"></span></label>
          <label><input type="radio" name="type" value="card"> <span data-i18n="type.card"></span></label>
          <label><input type="radio" name="type" value="identity"> <span data-i18n="type.identity"></span></label>
          <label><input type="radio" name="type" value="ssh"> <span data-i18n="type.ssh"></span></label>
        </div>
        <label><span><span data-i18n="field.name"></span> <span class="req" aria-hidden="true">*</span></span> <input name="name" required aria-required="true" maxlength="128" placeholder="GitHub"></label>
        <div class="field">
          <span id="folder-label" data-i18n="field.folder"></span>
          <div class="input-row">
          <div class="select" id="folder-select">
            <input type="hidden" name="folder">
            <button type="button" class="select-trigger" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="folder-label">
              <span class="select-value"></span>
              <i data-icon-slot="chevron-down" data-icon-size="14" data-icon-stroke="2"></i>
            </button>
            <div class="select-menu" role="listbox" hidden></div>
          </div>
          <button type="button" class="btn ghost icon" id="btn-new-folder-edit" data-i18n-title="folders.new" data-i18n-aria="folders.new"><i data-icon-slot="plus" data-icon-size="14" data-icon-stroke="2"></i></button>
          </div>
        </div>
        <hr id="divider"/>
        <div class="login-only">
          <label><span data-i18n="field.username"></span> <input name="username" autocomplete="off" maxlength="500" placeholder="you@example.com"></label>
          <label><span data-i18n="field.password"></span>
            <span class="input-row">
              <input name="password" type="text" data-masked autocomplete="off" maxlength="2000" class="mono">
              <button type="button" class="btn ghost icon" id="edit-toggle" data-i18n-title="password.toggle" data-i18n-aria="password.show"></button>
              <button type="button" class="btn ghost" id="edit-generate" data-i18n="password.generate"></button>
            </span>
          </label>
          <div class="meter"><span id="edit-meter"></span></div>
          <label><span data-i18n="field.website"></span> <input name="uris" type="text" autocomplete="off" maxlength="2000" placeholder="https://example.com"></label>
        </div>
        <div class="card-only" hidden>
          <label><span data-i18n="field.cardholder"></span> <input name="cardholder" autocomplete="off" maxlength="128" placeholder="JANE Q DOE"></label>
          <label><span data-i18n="field.cardNumber"></span>
            <span class="input-row">
              <input name="cardNumber" type="text" data-masked autocomplete="off" inputmode="numeric" maxlength="19" class="mono" placeholder="1234 5678 9012 3456">
              <button type="button" class="btn ghost icon" data-reveal="cardNumber"></button>
            </span>
          </label>
          <div class="row2">
            <label><span data-i18n="field.expiry"></span> <input name="cardExpiry" autocomplete="off" inputmode="numeric" maxlength="7" class="mono" placeholder="12/2028"></label>
            <label><span data-i18n="field.cvv"></span>
              <span class="input-row">
                <input name="cardCvv" type="text" data-masked autocomplete="off" inputmode="numeric" maxlength="4" class="mono" placeholder="•••">
                <button type="button" class="btn ghost icon" data-reveal="cardCvv"></button>
              </span>
            </label>
          </div>
        </div>
        <div class="identity-only" id="identity-fields" hidden></div>
        <div class="ssh-only" hidden>
          <div class="section-title" data-icon="key" data-title-key="ssh.sectionKey"></div>
          <div class="seg-row">
            <div class="seg" role="radiogroup" data-i18n-aria="ssh.sourceAria">
              <label><input type="radio" name="sshSource" value="new" checked> <span data-i18n="ssh.new"></span></label>
              <label><input type="radio" name="sshSource" value="import"> <span data-i18n="ssh.import"></span></label>
            </div>
            <div class="seg" id="ssh-algo-seg" role="radiogroup" data-i18n-aria="field.algorithm">
              <label><input type="radio" name="sshAlgo" value="ed25519" checked> Ed25519</label>
              <label><input type="radio" name="sshAlgo" value="rsa4096"> RSA 4096</label>
            </div>
          </div>
          <div class="ssh-import" id="ssh-import" hidden>
            <label><span data-i18n="ssh.privateToImport"></span> <textarea id="ssh-paste" rows="4" spellcheck="false" placeholder="-----BEGIN OPENSSH PRIVATE KEY-----"></textarea></label>
            <div class="ssh-tools">
              <button type="button" class="btn ghost" id="ssh-pick" data-i18n="ssh.chooseFile"></button>
              <input type="file" id="ssh-file" hidden>
            </div>
            <p class="ssh-hint" data-i18n="ssh.hint"></p>
          </div>
          <label><span data-i18n="ssh.title"></span> <input name="sshTitle" maxlength="128" placeholder="you@macbook" autocomplete="off"></label>
          <hr/>
          <div class="section-title" data-icon="shield" data-title-key="ssh.sectionPair"></div>
          <label><span><span data-i18n="ssh.public"></span> <span class="req" aria-hidden="true">*</span></span>
            <span class="input-row">
              <textarea name="sshPublicKey" rows="3" readonly spellcheck="false"></textarea>
              <button type="button" class="btn ghost icon" data-ssh-copy="public" data-i18n-aria="ssh.copyPublic"></button>
            </span>
          </label>
          <label><span data-i18n="ssh.fingerprint"></span>
            <span class="input-row">
              <input name="sshFingerprint" readonly>
              <button type="button" class="btn ghost icon" data-ssh-copy="fingerprint" data-i18n-aria="ssh.copyFingerprint"></button>
            </span>
          </label>
          <label><span data-i18n="ssh.private"></span>
            <span class="input-row">
              <input name="sshPrivateKey" type="text" data-masked readonly autocomplete="off" data-i18n-placeholder="ssh.privatePlaceholder">
              <button type="button" class="btn ghost icon" id="ssh-reveal"></button>
              <button type="button" class="btn ghost icon" data-ssh-copy="private" data-i18n-aria="ssh.copyPrivate"></button>
            </span>
          </label>
          <div class="ssh-tools" id="ssh-regen-row">
            <button type="button" class="btn ghost" id="ssh-regen" data-i18n="ssh.regen"></button>
          </div>
          <hr/>
          <div class="section-title" data-icon="server" data-title-key="ssh.sectionConn"></div>
          <label><span data-i18n="ssh.host"></span> <input name="sshHost" maxlength="253" autocomplete="off" placeholder="server.example.com" class="mono"></label>
          <div class="row2">
            <label><span data-i18n="ssh.user"></span> <input name="sshUser" maxlength="64" autocomplete="off" placeholder="ubuntu" class="mono"></label>
            <label><span data-i18n="ssh.port"></span> <input name="sshPort" maxlength="5" inputmode="numeric" autocomplete="off" placeholder="22" class="mono"></label>
          </div>
          <hr/>
          <div class="ssh-config-head"><span class="section-title" data-icon="file" data-title-key="ssh.configPreview"></span><button type="button" class="btn ghost" id="ssh-copy-config" data-i18n="common.copy"></button></div>
          <pre class="ssh-config" tabindex="0"><code id="ssh-config"></code></pre>
          <hr/>
        </div>
        <label><span data-i18n="field.notes"></span> <textarea name="notes" rows="5" data-i18n-placeholder="notes.placeholder"></textarea></label>
        <label class="check"><input type="checkbox" name="favorite"> <span data-i18n="item.favorite"></span></label>
        <p class="error" id="edit-error" role="alert"></p>
        <div class="actions">
          <button type="button" class="btn danger" id="btn-delete" data-i18n="common.delete"></button>
          <span class="grow"></span>
          <button type="button" class="btn ghost" id="btn-cancel" data-i18n="common.cancel"></button>
          <button type="submit" class="btn primary" data-i18n="common.save"></button>
        </div>
      </form>
    </section>
  </div>

  <dialog id="dlg-generator">
    <form method="dialog" class="dialog-body">
      <h2 data-i18n="sidebar.generator"></h2>
      <output id="gen-output" class="gen-output mono"></output>
      <p class="muted small" id="gen-bits"></p>
      <label><span data-i18n="gen.length"></span>
        <div class="gen-len">
          <input type="range" id="gen-length" min="8" max="128" value="20">
          <input type="number" id="gen-len-num" min="8" max="128" value="20" inputmode="numeric">
        </div>
      </label>
      <div class="checks">
        <label class="check"><input type="checkbox" id="gen-upper" checked> A–Z</label>
        <label class="check"><input type="checkbox" id="gen-lower" checked> a–z</label>
        <label class="check"><input type="checkbox" id="gen-digits" checked> 0–9</label>
        <label class="check"><input type="checkbox" id="gen-symbols" checked> !@#$</label>
        <label class="check"><input type="checkbox" id="gen-ambig"> <span data-i18n="gen.ambiguous"></span></label>
      </div>
      <div class="actions">
        <button type="button" class="btn ghost" id="gen-regen" data-i18n="gen.another"></button>
        <span class="grow"></span>
        <button type="button" class="btn ghost" id="gen-copy" data-i18n="common.copy"></button>
        <button type="button" class="btn primary" id="gen-use" hidden data-i18n="gen.use"></button>
        <button value="close" class="btn ghost" data-i18n="common.close"></button>
      </div>
    </form>
  </dialog>

  <dialog id="dlg-tools">
    <div class="dialog-body">
      <h2 data-i18n="tools.title"></h2>

      <section class="tool">
        <h3 data-i18n="tools.import.title"></h3>
        <p class="muted small" data-i18n="tools.import.help"></p>
        <button class="btn ghost" id="btn-import-open" data-i18n="tools.import.button"></button>
      </section>

      <section class="tool">
        <h3 data-i18n="tools.export.title"></h3>
        <p class="muted small" data-i18n="tools.export.help"></p>
        <button class="btn ghost" id="btn-export-open" data-i18n="tools.export.button"></button>
      </section>

      <section class="tool">
        <h3 data-i18n="tools.restore.title"></h3>
        <p class="muted small" data-i18n="tools.restore.help"></p>
        <input type="file" id="file-backup" accept=".json,application/json">
        <input type="text" data-masked id="backup-pass" data-i18n-placeholder="tools.restore.passPlaceholder" autocomplete="off">
        <button class="btn ghost" id="btn-restore" data-i18n="tools.restore.button"></button>
      </section>

      <p class="error" id="tools-msg" role="status"></p>
      <div class="actions">
        <span class="grow"></span>
        <button class="btn ghost" id="btn-tools-close" data-i18n="common.close"></button>
      </div>
    </div>
  </dialog>

  <dialog id="dlg-import">
    <div class="dialog-body">
      <h2 data-i18n="import.dlg.title"></h2>
      <label><span data-i18n="import.dlg.file"></span> <input type="file" id="import-file" accept=".json,application/json"></label>
      <label><span data-i18n="import.dlg.folders"></span>
        <select id="import-folders-mode">
          <option value="keep" data-i18n="import.dlg.folders.keep"></option>
          <option value="ignore" data-i18n="import.dlg.folders.ignore"></option>
        </select>
      </label>
      <label><span data-i18n="import.dlg.folder"></span> <input type="text" id="import-folder" list="import-folder-list" maxlength="200" autocomplete="off"></label>
      <datalist id="import-folder-list"></datalist>

      <section class="tool" id="import-preview" hidden>
        <p id="import-found"></p>
        <ul class="warn-list" id="import-warnings"></ul>
      </section>

      <p class="error" id="import-msg" role="status"></p>
      <div class="actions">
        <span class="grow"></span>
        <button class="btn ghost" id="btn-import-close" data-i18n="common.close"></button>
        <button class="btn primary" id="btn-import-run" data-i18n="import.dlg.run" disabled></button>
      </div>
    </div>
  </dialog>

  <dialog id="dlg-export">
    <div class="dialog-body">
      <h2 data-i18n="export.dlg.title"></h2>
      <label><span data-i18n="export.dlg.protection"></span>
        <select id="export-protection">
          <option value="encrypted" data-i18n="export.dlg.protection.encrypted"></option>
          <option value="plain" data-i18n="export.dlg.protection.plain"></option>
        </select>
      </label>
      <p class="muted small" id="export-note"></p>

      <section class="tool" id="export-plain" hidden>
        <p class="warn-box" role="alert" data-i18n="export.warning"></p>
        <label class="check"><input type="checkbox" id="export-confirm"> <span data-i18n="export.dlg.confirm"></span></label>
        <input type="text" data-masked id="export-password" data-i18n-placeholder="export.dlg.password" data-i18n-aria="export.dlg.password" autocomplete="off">
      </section>

      <ul class="warn-list" id="export-warnings"></ul>
      <p class="error" id="export-msg" role="status"></p>
      <div class="actions">
        <span class="grow"></span>
        <button class="btn ghost" id="btn-export-close" data-i18n="common.close"></button>
        <button class="btn primary" id="btn-export-run" data-i18n="export.dlg.run"></button>
      </div>
    </div>
  </dialog>

  <dialog id="dlg-password">
    <div class="dialog-body">
      <h2 data-i18n="menu.changePassword"></h2>
      <section class="tool">
        <input type="text" data-masked id="pw-current" data-i18n-placeholder="pw.current" autocomplete="off">
        <input type="text" data-masked id="pw-next" data-i18n-placeholder="pw.next" autocomplete="off">
      </section>
      <p class="error" id="pw-msg" role="status"></p>
      <div class="actions">
        <span class="grow"></span>
        <button class="btn ghost" id="btn-pw-close" data-i18n="common.cancel"></button>
        <button class="btn primary" id="btn-change-pw" data-i18n="pw.submit"></button>
      </div>
    </div>
  </dialog>

  <dialog id="dlg-destroy">
    <div class="dialog-body">
      <h2 data-i18n="destroy.title"></h2>
      <p id="destroy-text"></p>
      <p data-i18n="destroy.confirm"></p>
      <input type="text" data-masked id="destroy-confirm" data-i18n-placeholder="unlock.placeholder" autocomplete="off" data-i18n-aria="field.masterPassword">
      <p class="error" id="destroy-msg" role="alert"></p>
      <div class="actions">
        <span class="grow"></span>
        <button class="btn ghost" id="btn-destroy-cancel" data-i18n="common.cancel"></button>
        <button class="btn danger" id="btn-destroy" disabled data-i18n="menu.deleteVault"></button>
      </div>
    </div>
  </dialog>

  <dialog id="dlg-folder">
    <form class="dialog-body" id="form-folder" autocomplete="off">
      <h2 data-i18n="folders.new"></h2>
      <p data-i18n="folder.newHelp"></p>
      <input type="text" id="folder-name" maxlength="200" data-i18n-placeholder="folder.namePlaceholder" data-i18n-aria="folder.namePlaceholder">
      <p class="error" id="folder-msg" role="alert"></p>
      <div class="actions">
        <span class="grow"></span>
        <button type="button" class="btn ghost" id="btn-folder-cancel" data-i18n="common.cancel"></button>
        <button type="submit" class="btn primary" id="btn-folder-create" disabled data-i18n="folder.create"></button>
      </div>
    </form>
  </dialog>

  <dialog id="dlg-folder-edit">
    <form class="dialog-body" id="form-folder-edit" autocomplete="off">
      <h2 data-i18n="folder.editTitle"></h2>
      <p data-i18n="folder.editHelp"></p>
      <input type="text" id="folder-edit-name" maxlength="200" data-i18n-placeholder="folder.namePlaceholder" data-i18n-aria="folder.namePlaceholder">
      <p class="error" id="folder-edit-msg" role="alert"></p>
      <div id="folder-delete-panel" hidden>
        <p id="folder-delete-text"></p>
        <label class="check" id="folder-delete-items-row"><input type="checkbox" id="folder-delete-items"> <span id="folder-delete-items-label"></span></label>
      </div>
      <div class="actions">
        <button type="button" class="btn danger" id="btn-folder-delete"></button>
        <span class="grow"></span>
        <button type="button" class="btn ghost" id="btn-folder-edit-cancel" data-i18n="common.cancel"></button>
        <button type="submit" class="btn primary" id="btn-folder-save" data-i18n="common.save"></button>
      </div>
    </form>
  </dialog>

  <div class="lang-switch" role="group" data-i18n-aria="lang.label"><button type="button" data-lang="en" lang="en" title="English" aria-label="English"><svg viewBox="0 0 60 40" width="22" height="15" aria-hidden="true"><clipPath id="uk"><rect width="60" height="40" rx="4"/></clipPath><g clip-path="url(#uk)"><rect width="60" height="40" fill="#012169"/><path d="M0 0l60 40M60 0L0 40" stroke="#fff" stroke-width="8"/><path d="M0 0l60 40M60 0L0 40" stroke="#C8102E" stroke-width="3"/><path d="M30 0v40M0 20h60" stroke="#fff" stroke-width="13"/><path d="M30 0v40M0 20h60" stroke="#C8102E" stroke-width="7"/></g></svg></button><button type="button" data-lang="pt" lang="pt" title="Português" aria-label="Português"><svg viewBox="0 0 60 40" width="22" height="15" aria-hidden="true"><clipPath id="br"><rect width="60" height="40" rx="4"/></clipPath><g clip-path="url(#br)"><rect width="60" height="40" fill="#009C3B"/><path d="M30 5l24 15-24 15L6 20z" fill="#FFDF00"/><circle cx="30" cy="20" r="8" fill="#002776"/></g></svg></button></div>
  <div id="clip-chip" class="clip-chip" role="status" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
