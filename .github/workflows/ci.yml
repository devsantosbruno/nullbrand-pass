name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(github.event_name == 'pull_request' && '{"include":[{"os":"ubuntu-latest","node":"22.14.0"},{"os":"ubuntu-latest","node":"lts/*"},{"os":"windows-latest","node":"lts/*"}]}' || '{"os":["ubuntu-latest","macos-latest","windows-latest"],"node":["22.14.0","lts/*"]}') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run verify
      - run: npm audit --omit=dev
      - name: Install Linux clipboard tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y xvfb xclip
      - name: Real clipboard (Linux, X11 under xvfb)
        if: runner.os == 'Linux'
        env:
          NULLBRAND_REAL_CLIPBOARD: '1'
        run: xvfb-run --auto-servernum node --test dist/test/clipboard-real.test.js
      - name: Real clipboard (macOS, Windows)
        if: runner.os != 'Linux'
        env:
          NULLBRAND_REAL_CLIPBOARD: '1'
        run: node --test dist/test/clipboard-real.test.js

  coverage:
    name: coverage (crypto, vault)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - run: npm ci
      - run: npm run check && npm run build
      - run: npm run coverage

  package:
    name: package contents
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - run: npm ci
      - run: npm run build
      - name: Tarball excludes tests, web sources and non-public typings
        run: |
          npm pack --dry-run --json --ignore-scripts > pack.json
          node -e "
            const files = JSON.parse(require('fs').readFileSync('pack.json', 'utf8'))[0].files.map((f) => f.path);
            const bad = files.filter((f) => /^dist\/(test|src\/web)\//.test(f) || /^dist\/(bin|public)\/.*\.d\.ts$/.test(f) || f.includes('.tsbuildinfo'));
            if (bad.length) { console.error('Unexpected files in tarball:\n' + bad.join('\n')); process.exit(1); }
            if (!files.includes('dist/bin/nullbrand.js')) { console.error('bin missing from tarball'); process.exit(1); }
            const types = ['dist/src/vault.d.ts', 'dist/src/generator.d.ts', 'dist/src/formats/index.d.ts'].filter((f) => !files.includes(f));
            if (types.length) { console.error('Type declarations missing from tarball:\n' + types.join('\n')); process.exit(1); }
          "

  ci-ok:
    name: ci-ok
    if: always()
    needs: [verify, coverage, package]
    runs-on: ubuntu-latest
    steps:
      - run: |
          test "${{ needs.verify.result }}" = success
          test "${{ needs.coverage.result }}" = success
          test "${{ needs.package.result }}" = success
